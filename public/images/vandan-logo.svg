<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title>Vandan Distributors logo</title>
  <desc>Blue and graphite geometric V mark with VANDAN wordmark and DISTRIBUTORS tagline.</desc>
  <defs>
    <linearGradient id="markBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#52d0ff"/>
      <stop offset="100%" stop-color="#1294d9"/>
    </linearGradient>
    <linearGradient id="markDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4b4f55"/>
      <stop offset="100%" stop-color="#2a2d31"/>
    </linearGradient>
    <linearGradient id="wordBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3fd0ff"/>
      <stop offset="100%" stop-color="#1a9fe3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="#ffffff"/>

  <g filter="url(#shadow)">
    <path d="M360 110 L490 110 L600 300 L710 110 L840 110 L600 530 Z" fill="url(#markDark)"/>
    <path d="M600 110 L735 360 L600 300 L465 360 Z" fill="url(#markBlue)"/>
    <path d="M360 110 L465 360 L600 300 L490 110 Z" fill="#2b80c9"/>
    <path d="M840 110 L735 360 L600 300 L710 110 Z" fill="#2f5e96"/>
    <path d="M600 530 L465 360 L600 300 L735 360 Z" fill="#1f4d7d"/>
  </g>

  <text x="600" y="690" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="128" font-weight="800" letter-spacing="2" fill="url(#wordBlue)" stroke="#1f415e" stroke-width="10" paint-order="stroke fill">VANDAN</text>
  <text x="600" y="765" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700" letter-spacing="8" fill="#44484d">DISTRIBUTORS</text>
</svg>